[package]
name = "language-translation-app"
version = "6.0.0"
edition = "2024"
description = "Language Translation App with AI (ChatGPT, Gemini, Bing Chat, Bard, Google Translate) ported to Rust with gpui-kit"

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2"
chrono = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
