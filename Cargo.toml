[package]
name = "language-translation-app"
version = "6.3.0"
edition = "2024"
description = "Language Translation App with AI (OpenAI, Gemini, Claude, DeepSeek, Ollama, Google Translate) built in Rust with gpui-kit"

[dependencies]
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
base64 = "0.22"
thiserror = "2"
chrono = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
global-hotkey = "0.10"
keyring = "4.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
