name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            asset_name: language-translation-app-macos-arm64.tar.gz
            dmg_name: Translate-App-with-AI-macos-arm64.dmg
            bin_name: language-translation-app
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: language-translation-app-windows-x86_64.zip
            dmg_name: ""
            bin_name: language-translation-app.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry, index, and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true
          save-if: "true"

      - name: Run unit tests
        run: cargo test --lib --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS .app (with AppIcon.icns), .dmg, and .tar.gz
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "master" ]; then VERSION="7.0.0"; fi

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" dist/
          tar -czf "${{ matrix.asset_name }}" -C dist "${{ matrix.bin_name }}"
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

          APP_DIR="dist/Translate App with AI.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$APP_DIR/Contents/MacOS/${{ matrix.bin_name }}"
          cp "src/icon.icns" "$APP_DIR/Contents/Resources/AppIcon.icns"
          chmod +x "$APP_DIR/Contents/MacOS/${{ matrix.bin_name }}"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Translate App with AI</string>
            <key>CFBundleDisplayName</key>
            <string>Translate App with AI</string>
            <key>CFBundleIdentifier</key>
            <string>com.wk18k.language-translation-app</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>${{ matrix.bin_name }}</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --deep --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP_DIR"
          else
            codesign --force --deep --sign - "$APP_DIR" || true
          fi

          mkdir -p dmg_stage
          cp -R "$APP_DIR" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Translate App with AI" -srcfolder dmg_stage -ov -format UDZO "${{ matrix.dmg_name }}"
          shasum -a 256 "${{ matrix.dmg_name }}" > "${{ matrix.dmg_name }}.sha256"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination dist/
          Compress-Archive -Path "dist/${{ matrix.bin_name }}" -DestinationPath "${{ matrix.asset_name }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}").Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.dmg
            *.zip
            *.sha256
          retention-days: 7

  release:
    name: Publish / Replace GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release (replacing existing assets)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.sha256
